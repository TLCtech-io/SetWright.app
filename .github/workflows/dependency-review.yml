name: Dependency review

# Blocks a PR that introduces a new vulnerable or badly-licensed dependency. Free on public repos.
#
# Scope worth knowing: this compares the base and head manifests, so it only sees dependencies the
# PR changes. It will not flag an advisory that already sits in package-lock.json. Dependabot is
# what covers the existing tree.
on:
    pull_request:

permissions:
    contents: read

jobs:
    review:
        name: review changed dependencies
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/dependency-review-action@v5
              with:
                  fail-on-severity: high
                  # No allow-ghsas list. The sharp exception that used to sit here is gone: the root
                  # overrides now force the patched 0.35.x, so there is no advisory to allow.
                  # No PR comment, so the job needs no pull-requests: write. Results are in the
                  # job log and the checks tab. Same least-privilege line ci.yml takes.
                  comment-summary-in-pr: never
