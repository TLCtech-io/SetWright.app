name: CI

on:
    # Protected branches only. A feature branch gets its run from pull_request instead. Listing "**"
    # here fired both events for the same commit on any branch with an open PR, and the two runs wrote
    # check-runs under identical names, so whichever lost the concurrency race left a cancelled
    # conclusion that a required status check reads as failure. The cost is that a feature branch with
    # no PR open gets no run at all; open the PR as a draft to get it back.
    push:
        branches: [prod-staging, main]
    pull_request:

# Branch process: feature branches -> prod-staging -> main. prod-staging is the integration branch and
# the default PR target; main is production and is only reached by promoting prod-staging.
#
# Narrowing the push trigger does not remove the double fire on its own. The promotion PR still fires
# both events, because prod-staging is a push target above AND the head of that PR. So the exemption
# has to hold on both event types, which means reading the branch the same way the group key does.
# github.ref_name is not the branch on a pull_request event, it is "<number>/merge", so the earlier
# form exempted push runs only and let the PR run cancel the push run out from under it.
#
# Net effect: both protected branches are exempt on either event, so every merge into prod-staging and
# every promotion to main completes for the record. Feature branches stay cancellable, since only the
# tip matters, and they now only ever have one run to cancel.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' && (github.head_ref || github.ref_name) != 'prod-staging' }}

# Least privilege: these jobs only read the repo (no PR comments, releases, or pushes), so drop the
# default token down to read-only (Codex security #7). A job that ever needs to write must opt back
# in explicitly.
permissions:
    contents: read

jobs:
    # main only accepts promotions from prod-staging. Feature work reaches production by merging to
    # prod-staging first, so whatever lands on main has already had the full suite run against that exact
    # tree, lockfile included. Without this, a feature branch can PR straight to main and skip the
    # integration tier entirely.
    #
    # The job runs on every event and the check is conditional inside it, rather than skipping the whole
    # job with a job-level `if`. That keeps the status name reporting a real result on every PR, which is
    # what a required status check in branch protection needs. The cost is a few seconds of runner time.
    #
    # head_ref goes through env instead of straight into the shell. A branch name is attacker-controlled
    # on a fork PR, so interpolating it into a run block is a script injection.
    promotion-guard:
        name: promotion guard (main <- prod-staging)
        runs-on: ubuntu-latest
        steps:
            - name: Require prod-staging as the source branch
              if: github.event_name == 'pull_request' && github.base_ref == 'main'
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [ "$HEAD_REF" != "prod-staging" ]; then
                      echo "::error::main only accepts merges from prod-staging. This PR is from '$HEAD_REF'. Merge to prod-staging first, then promote."
                      exit 1
                  fi
                  echo "Promotion source is prod-staging."

    verify:
        name: typecheck · build · unit tests
        runs-on: ubuntu-latest
        steps:
            - uses:
                  actions/checkout@v7
                  # Sec 6: fail fast if automation would push the local-only auth rate limits to prod, or if the
                  # config.toml LOCAL-ONLY marker was dropped. See scripts/check-config-safety.sh.
            - run: bash scripts/check-config-safety.sh
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # Every workspace `test` script is a hand-written chain of tsx calls, not a glob, so a new
            # test file runs nowhere until it is appended. Without this, verify goes green over coverage
            # that never executed. Needs node but not the dependencies, so it runs before npm ci.
            - run: node scripts/check-test-registration.mjs
            # CREATE OR REPLACE FUNCTION clears a function's configuration, so a redeclaration
            # silently drops an earlier `set search_path` pin. Migration 059 pins the two hydration
            # functions by ALTER rather than redeclaring them, and hydrate_draft_input has already
            # been redeclared five times. This models the final state of every function in the set.
            # Needs node but not the dependencies, so it runs before npm ci.
            - run: node scripts/check-search-path-pins.mjs
            - run: npm ci
            - run: npm run verify

    # The integration + e2e suites need the local Supabase stack (Docker) + a browser, so they run as
    # separate stack-backed jobs (the runner has Docker). Each starts the CLI, runs the suite, stops.
    integration:
        name: integration (supabase stack)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # Pinned to a commit, not to a floating ref, which would otherwise move under a job that
            # holds GITHUB_TOKEN. This SHA is the v3.0.0 release. The trailing comment names the tag
            # so Dependabot can resolve it, which is how this moved off v2.1.1. Two coordinates move
            # together on an upgrade: this SHA and the version below.
            - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
              with:
                  version: 2.109.1 # pinned to the dev devDependency's resolved version (package.json supabase ^2.108.0); bump together
            - run: npm ci
            - run: supabase start
            - run: npm run test:integration
            - if: always()
              run: supabase stop

    e2e:
        name: e2e (playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # Pinned to a commit, not to a floating ref, which would otherwise move under a job that
            # holds GITHUB_TOKEN. This SHA is the v3.0.0 release. The trailing comment names the tag
            # so Dependabot can resolve it, which is how this moved off v2.1.1. Two coordinates move
            # together on an upgrade: this SHA and the version below.
            - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
              with:
                  version: 2.109.1 # pinned to the dev devDependency's resolved version (package.json supabase ^2.108.0); bump together
            - run: npm ci
            # Resolved through the workspace that owns playwright, not through a bare root npx.
            # npm hoists opportunistically, so @playwright/test sat in the root node_modules until a
            # toolchain bump pushed it down into apps/web, and root npx stopped finding it (exit 127,
            # "playwright: not found"). --no makes a missing binary fail loudly here rather than
            # silently fetching some other version from the registry.
            - run: npm exec --workspace apps/web --no -- playwright install --with-deps chromium
            - run: supabase start
            - run: npm run test:e2e
            - if: always()
              run: supabase stop
