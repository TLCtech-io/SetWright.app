version: 2

# No target-branch key anywhere in this file, deliberately. Setting it would restrict this config
# to version updates only: security update PRs ignore target-branch and always open against the
# default branch. The default branch is already prod-staging, which is where these belong, so
# omitting the key means one config governs both kinds of update.
updates:
    # npm workspaces resolve against the single root lockfile, so one entry at "/" covers
    # apps/web and packages/* as well.
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          # Minor and patch bumps land as one PR so the suite runs once, not fifteen times.
          # Majors stay separate: next, react and supabase-js each deserve their own read.
          non-major:
              update-types:
                  - minor
                  - patch
      ignore:
          # The Supabase CLI pin is duplicated in ci.yml (supabase/setup-cli version) and the two
          # must move together. An unattended bump here would silently desync them, so take this
          # one by hand. See the pin comment in .github/workflows/ci.yml.
          - dependency-name: supabase
            update-types:
                ["version-update:semver-major", "version-update:semver-minor"]
          # A compiler major is a migration, not an update. TypeScript 7 is the native port and a
          # different compiler: an unattended 5 -> 7 bump broke typecheck across all four workspaces
          # with resolution, inference and narrowing changes that have nothing to do with our code.
          # Minor and patch still flow through the non-major group.
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
          # @types/node majors track Node releases, so this one is pinned to the runtime rather than
          # to whatever is newest. ci.yml runs node-version 22, and types ahead of the runtime let
          # typecheck pass on APIs that are not there at run time. Move it when the runner moves.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    # Action versions drift and unpinned majors are a real supply chain surface.
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns: ["*"]
